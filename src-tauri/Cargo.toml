[package]
name = "sdl_acc_core"
version = "1.0.0"
description = "SDL ACC - Offline Desktop Accounting & Inventory Application"
authors = ["SDL ACC Team"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2" }

[dependencies]
tauri = { version = "2.12.3" }
tauri-plugin-log = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
log = "0.4"
thiserror = "2.0"
sha2 = "0.10"
hex = "0.4"
